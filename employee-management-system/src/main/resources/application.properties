# ===============================================
# Employee Management System - Configuration
# ===============================================

server.port=8080
spring.application.name=employee-management

# MySQL Database Settings
# Note: Ensure MySQL Server is running and update username/password to match your local setup
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Properties (Dialect is auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static content location
spring.web.resources.static-locations=classpath:/static/
