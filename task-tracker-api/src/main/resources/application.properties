spring.application.name=task-tracker-api
server.port=8081

# Default active profile:
# 'dev' enables instant in-memory execution with MySQL compatibility mode & H2 console
# 'mysql' enables connection to your local MySQL 8.0 server (task_tracker_db)
spring.profiles.active=dev

# Jackson JSON formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Global API Logging
logging.level.com.tasktracker.api=DEBUG
logging.level.org.springframework.web=INFO
