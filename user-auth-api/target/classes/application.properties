# ========================================================
# User Authentication API - Spring Boot Configuration
# ========================================================

server.port=8080
spring.application.name=user-auth-api

# MySQL Database Configuration
# Connects backend services with MySQL for persistent user data
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
# 256-bit secure key for HMAC-SHA
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours in milliseconds (86400000 ms)
app.jwt.expiration-ms=86400000

# Static Web Console Configuration
spring.web.resources.static-locations=classpath:/static/
